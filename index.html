<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#050713">
  <title>Neon Rush — Mobile Racing</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="gameShell">
    <canvas id="game"></canvas>

    <section id="hud" aria-label="Game HUD">
      <div class="hud-card"><span>SCORE</span><strong id="score">0</strong></div>
      <div class="hud-card"><span>BEST</span><strong id="best">0</strong></div>
      <div class="hud-card"><span>COINS</span><strong id="coins">0</strong></div>
      <div class="hud-card"><span>SPEED</span><strong id="speed">0</strong></div>
    </section>

    <div id="lives" aria-label="Lives"></div>

    <section id="overlay" class="show">
      <div class="panel">
        <div class="eyebrow">MOBILE ARCADE RACER</div>
        <h1>NEON <span>RUSH</span></h1>
        <p id="message">Dodge traffic, collect coins and chase a new high score.</p>
        <div class="car-picker">
          <button class="car-choice active" data-car="cyan">CYAN</button>
          <button class="car-choice" data-car="red">RED</button>
          <button class="car-choice" data-car="gold">GOLD</button>
        </div>
        <button id="startBtn" class="primary">START RACE</button>
        <button id="fullscreenBtn" class="secondary">FULLSCREEN</button>
        <p class="tip">Steer with ◀ ▶ or A/D / arrows. Hold BRAKE or ↓ / S to slow down.</p>
      </div>
    </section>

    <button id="pauseBtn" class="round-btn" aria-label="Pause">Ⅱ</button>

    <section id="controls">
      <button id="leftBtn" class="control" aria-label="Steer left">◀</button>
      <button id="brakeBtn" class="control brake" aria-label="Brake">BRAKE</button>
      <button id="rightBtn" class="control" aria-label="Steer right">▶</button>
    </section>

    <div id="toast"></div>
  </main>
  <script src="game.js"></script>
</body>
</html>
